tier: "orchestrator"
role: "audit"
calls: "slop-scan, voice-audit, voice-costume-audit, scaffold-architecture-audit, minimal-edit"
interface:
  display_name: "Audit Pass"
  short_description: "Orchestrated local and whole-artifact audit sweep"
  default_prompt: "Use $final-audit-pass to run an orchestrated audit sweep over a section or whole draft: dispatch independent fresh-context $slop-scan + $voice-audit and, for a whole draft, a blind-then-reveal $voice-costume-audit; preserve the full frozen costume subreport; hold every persona finding for a human keep/modify/remove decision because costume is not automatically bad; conservatively resolve only local low-risk issues; run $scaffold-architecture-audit only on a supplied raw scaffold, then check finished-prose seams and batch author decisions."

policy:
  allow_implicit_invocation: true
